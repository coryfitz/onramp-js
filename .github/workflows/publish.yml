name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
      version: ${{ steps.registry.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check whether this version is already on npm
        id: registry
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { appendFileSync } = require("node:fs");
          const packageMetadata = require("./package.json");
          const registryOutput = execFileSync(
            "npm",
            ["view", packageMetadata.name, "versions", "--json"],
            { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"] },
          );
          const registryValue = JSON.parse(registryOutput);
          const publishedVersions = Array.isArray(registryValue)
            ? registryValue
            : [registryValue];
          const alreadyPublished = publishedVersions.includes(packageMetadata.version);

          console.log(
            `${packageMetadata.name}@${packageMetadata.version} ` +
              (alreadyPublished ? "is already published." : "is new and will be published."),
          );
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${packageMetadata.version}\npublish=${String(!alreadyPublished)}\n`,
          );
          NODE

  publish:
    needs: check_version
    if: needs.check_version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Run tests
        run: npm test

      - name: Test a locally generated universal app
        run: |
          app_dir="${RUNNER_TEMP}/onramp-js-local-smoke"
          package_version="$(node -p "require('./package.json').version")"
          package_tarball="${RUNNER_TEMP}/onramp-js-${package_version}.tgz"
          npm pack --pack-destination "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}"
          ONRAMP_JS_PACKAGE_SPEC="${package_tarball}" \
            node "${GITHUB_WORKSPACE}/bin/onramp-js.js" create onramp-js-local-smoke
          cd "${app_dir}"
          npm test
          npm run typecheck
          npm run build:web

      - name: Prepare npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm publish

  verify:
    needs: [check_version, publish]
    if: >-
      always() &&
      needs.check_version.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Wait for the version to become installable
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 120); do
            if npm view "${package_name}@${package_version}" version --prefer-online >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is available on npm."
              exit 0
            fi
            echo "Waiting for npm to process ${package_name}@${package_version} (${attempt}/120)..."
            sleep 5
          done
          echo "${package_name}@${package_version} is not installable after 10 minutes." >&2
          exit 1

      - name: Test a scaffold from the public npm package
        env:
          PACKAGE_VERSION: ${{ needs.check_version.outputs.version }}
        run: |
          app_dir="${RUNNER_TEMP}/onramp-js-public-smoke"
          cd "${RUNNER_TEMP}"
          created=false
          for attempt in $(seq 1 120); do
            cache_dir="${RUNNER_TEMP}/npm-public-smoke-cache-${attempt}"
            if NPM_CONFIG_CACHE="${cache_dir}" \
              npm exec --yes --prefer-online \
                --package "onramp-js@${PACKAGE_VERSION}" -- \
                onramp-js create onramp-js-public-smoke; then
              created=true
              break
            fi
            rm -rf "${app_dir}"
            echo "Waiting for npm package installation to propagate (${attempt}/120)..."
            sleep 5
          done
          if [[ "${created}" != "true" ]]; then
            echo "onramp-js@${PACKAGE_VERSION} could not scaffold an app after 10 minutes." >&2
            exit 1
          fi
          cd "${app_dir}"
          npm test
          npm run typecheck
          npm run build:web
